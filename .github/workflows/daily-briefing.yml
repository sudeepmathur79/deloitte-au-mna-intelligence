name: Daily Deloitte Australia M&A Briefing

on:
  push:
    branches: [main]
  schedule:
    - cron: '45 6 * * *'
      timezone: 'Australia/Sydney'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Research lookback window in days'
        required: false
        default: '7'
        type: string

permissions:
  contents: write

concurrency:
  group: daily-mna-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OLLAMA_MODEL: qwen3:4b
      LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore local model cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen3-4b-v1
          restore-keys: ollama-qwen3-4b-

      - name: Install Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:11434/api/tags >/dev/null

      - name: Ensure local model is available
        run: ollama pull "$OLLAMA_MODEL"

      - name: Generate briefing
        run: python3 scripts/run_briefing.py

      - name: Commit briefing
        run: |
          git config user.name 'deloitte-au-mna-intelligence[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add briefings/
          if git diff --cached --quiet; then
            echo 'No briefing changes to commit.'
            exit 0
          fi
          git commit -m "Add daily M&A briefing $(date -u +%Y-%m-%d)"
          git push
